<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Halotone</title>
  <meta name="description" content="Halotone: drag glowing dots into songs. For iPhone and iPad.">
  <link rel="icon" href="/assets/favicon.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="stylesheet" href="/assets/site.css">
</head>
<body>
  <div class="page">
    <header class="site">
      <a class="home" href="/">Johannes Reich</a>
      <nav>
        <a href="/halotone/" aria-current="page">Halotone</a>
        <a href="/halotone/support/">Support</a>
        <a href="/halotone/privacy/">Privacy</a>
      </nav>
    </header>
    <main class="hero">
      <img src="/assets/halotone-512.png" alt="The Halotone app icon">
      <h1>Halotone</h1>
      <p class="lede">Halotone turns a ring of light into an instrument. Every glowing dot is a sound: drag it around the ring and hear a song take shape, then pick one of nine moods and the whole song follows.</p>
      <div class="links">
        <a class="button" href="/halotone/support/">Support</a>
        <a class="button" href="/halotone/privacy/">Privacy</a>
      </div>
      <div class="dots" aria-hidden="true">
        <i style="color: var(--cyan)"></i>
        <i style="color: var(--pink)"></i>
        <i style="color: var(--violet)"></i>
        <i style="color: var(--gold)"></i>
      </div>
    </main>
    <footer class="site">
      <span>© 2026 Johannes Reich</span>
      <a href="/impressum/">Impressum</a>
      <a href="/halotone/privacy/">Privacy</a>
    </footer>
  </div>
</body>
</html>
